<div class="form">
  <h2>Login</h2>
  <form (ngSubmit)="submit()" [formGroup]="form">
    <div>
      <label>Email</label>
      <input formControlName="email" />
    </div>
    <div>
      <label>Password</label>
      <input type="password" formControlName="password" />
    </div>
    <div *ngIf="error" class="error">{{error}}</div>
    <button type="submit">Login</button>
  </form>
</div>
